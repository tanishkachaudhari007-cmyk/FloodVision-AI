version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///./floodvision.db
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      # Add satellite credentials here or via .env file:
      # - COPERNICUS_CLIENT_ID=
      # - COPERNICUS_CLIENT_SECRET=
      # - OPENAI_API_KEY=
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8000
